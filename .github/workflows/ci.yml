name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      # It must refuse to run without root rather than sit there doing nothing:
      # SleepDisabled is a privileged setting, and `pmset` exits 0 even when it
      # declines the write, so a silent no-op is the failure mode to guard.
      - name: Refuses to run as non-root
        run: |
          set +e
          out=$(./capslock-daemon 2>&1)
          code=$?
          set -e
          echo "$out"
          [ "$code" -eq 1 ] || { echo "expected exit 1, got $code"; exit 1; }
          case "$out" in
            *"must run as root"*) ;;
            *) echo "expected a root-required message"; exit 1 ;;
          esac

  nix:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Not cachix/install-nix-action: the macOS runner image already carries
      # the _nixbld users, and that installer aborts on eDSRecordAlreadyExists.
      # This one reconciles with an existing install instead of failing.
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            experimental-features = nix-command flakes
      - name: Build the flake package
        run: nix build .#capslock-daemon --print-build-logs
